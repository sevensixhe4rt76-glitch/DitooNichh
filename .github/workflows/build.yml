
name: Build DitooNichh APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: |
          unzip -q DitooNichh-Android-Source.zip -d unpacked
          find unpacked -type f \( -name settings.gradle -o -name settings.gradle.kts \)

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          PROJECT_FILE=$(find unpacked \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          test -n "$PROJECT_FILE"
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DitooNichh-APK
          path: unpacked/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
